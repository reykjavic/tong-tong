# Tong Tong serverless WhatsApp backend — SAM template (see SCOPE.md).
#
# Milestone 0: the whatsapp-webhook Lambda + API Gateway route. Every future
# backend Lambda (auth/meta, auth/google, orders, messages, ...) slots in here
# as another AWS::Serverless::Function resource — SAM wires the API route,
# invoke permission and stage automatically, which is the whole point of SAM
# once there are several functions (decap-oauth currently lives outside this
# stack; it can be onboarded later).
#
# Secrets are NOT in this file. scripts/deploy-backend.sh reads the gitignored
# backend/.env.whatsapp and backend/.env.google and passes the values as
# parameters (NoEcho hides them from the console). Optional params fall back
# to the handler's defaults when left empty.
#
# Deploy:  ./scripts/deploy-backend.sh   (runbook: backend/README.md)

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tong Tong serverless WhatsApp backend — M0 webhook + auto-reply, RestaurantData table

Parameters:
  VerifyToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: Token shared with the Meta webhook config (VERIFY_TOKEN)
  MetaAccessToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: Permanent Meta Cloud API system-user token
  PhoneNumberId:
    Type: String
    Default: ''
    Description: Numeric ID of the WhatsApp Business number that sends replies
  AppSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Meta App secret — HMAC key for X-Hub-Signature-256
  AutoReplyText:
    Type: String
    Default: ''
    Description: Fixed auto-reply text; empty = handler echoes the inbound message
  GraphApiVersion:
    Type: String
    Default: v25.0
    Description: Graph API version for the Messages API
  BusinessWaId:
    Type: String
    Default: ''
    Description: The restaurant's own WhatsApp number (loop guard); empty = rely on the direction field
  GoogleClientId:
    Type: String
    NoEcho: true
    Default: ''
    Description: Google OAuth Web client ID (admin dashboard login)
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Google OAuth Web client secret — also the HMAC key for the OAuth state
  AdminEmail:
    Type: String
    Default: 247reyk@gmail.com
    Description: Google account email allowed into /dashboard; any other login is rejected server-side
  SiteUrl:
    Type: String
    Default: https://d22hrnca27jxah.cloudfront.net
    Description: Origin the OAuth callback redirects back to (the SPA). Single value — staging today, decide at the prod cutover

Resources:
  # Explicit API Gateway REST API (SCOPE.md §12: one API, every function's route
  # under it). Cors is needed by the public site's browser calls (GET /config
  # now, POST /toggle + /auth/* in M2); Meta's webhook POST is server-to-server
  # and unaffected. SAM adds an OPTIONS mock for every path so preflight never
  # reaches the Lambdas — but Lambda-proxy responses MUST still carry
  # Access-Control-Allow-Origin themselves (the config/auth/toggle lambdas do;
  # 302 redirects don't need it).
  BackendApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,OPTIONS,POST'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  WhatsAppWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/whatsapp-webhook/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          VERIFY_TOKEN: !Ref VerifyToken
          META_ACCESS_TOKEN: !Ref MetaAccessToken
          PHONE_NUMBER_ID: !Ref PhoneNumberId
          APP_SECRET: !Ref AppSecret
          AUTO_REPLY_TEXT: !Ref AutoReplyText
          GRAPH_API_VERSION: !Ref GraphApiVersion
          BUSINESS_WA_ID: !Ref BusinessWaId
      Events:
        WebhookGet:
          Type: Api
          Properties:
            Path: /webhook/whatsapp
            Method: get
            RestApiId: !Ref BackendApi
        WebhookPost:
          Type: Api
          Properties:
            Path: /webhook/whatsapp
            Method: post
            RestApiId: !Ref BackendApi

  # RestaurantData (DynamoDB, single-table — SCOPE.md §6). M0's webhook doesn't
  # write to it yet; the table is created now so M1 (orders + message log) is ready.
  # Retain on stack teardown: never destroy order data with a template change.
  RestaurantData:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: RestaurantData
      BillingMode: PAY_PER_REQUEST
      # Opaque admin sessions (PK='session') expire via TTL. Existing config
      # items carry no TTL attribute, so they are never expired. In-place update
      # on the existing table — does not replace it.
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: TTL
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: Status
          AttributeType: S
        - AttributeName: CreatedAt
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: Status
              KeyType: HASH
            - AttributeName: CreatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Feature-toggle config endpoint (SCOPE.md §12) — GET /config reads the two
  # toggles from this table. IAM scoped to GetItem on RestaurantData only.
  ConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/config/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref RestaurantData
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !GetAtt RestaurantData.Arn
      Events:
        ConfigGet:
          Type: Api
          Properties:
            Path: /config
            Method: get
            RestApiId: !Ref BackendApi

  # Google OAuth for the admin dashboard (SCOPE.md §12: auth chosen over the
  # shared staff token). GET /auth/login 302s to Google; the callback exchanges
  # the code, verifies the id_token, gates on AdminEmail, and mints an opaque
  # session (PK='session', TTL 7d). /auth/me + /auth/logout take the session
  # token as a Bearer header. Empty Google params -> 503 (auth ships inert).
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/auth/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          ADMIN_EMAIL: !Ref AdminEmail
          SITE_URL: !Ref SiteUrl
          TABLE_NAME: !Ref RestaurantData
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource:
                - !GetAtt RestaurantData.Arn
      Events:
        AuthLogin:
          Type: Api
          Properties:
            Path: /auth/login
            Method: get
            RestApiId: !Ref BackendApi
        AuthCallback:
          Type: Api
          Properties:
            Path: /auth/google/callback
            Method: get
            RestApiId: !Ref BackendApi
        AuthMe:
          Type: Api
          Properties:
            Path: /auth/me
            Method: get
            RestApiId: !Ref BackendApi
        AuthLogout:
          Type: Api
          Properties:
            Path: /auth/logout
            Method: post
            RestApiId: !Ref BackendApi

  # Admin-only web toggle (replaces the shell-script flip for the dashboard).
  # Bearer session required; session email must equal AdminEmail. Writes the
  # same config-item shape as scripts/set-toggle.sh (PK='config').
  ToggleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/toggle/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref RestaurantData
          ADMIN_EMAIL: !Ref AdminEmail
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource:
                - !GetAtt RestaurantData.Arn
      Events:
        TogglePost:
          Type: Api
          Properties:
            Path: /toggle
            Method: post
            RestApiId: !Ref BackendApi

Outputs:
  WebhookFunction:
    Description: whatsapp-webhook Lambda ARN
    Value: !GetAtt WhatsAppWebhookFunction.Arn
  WebhookUrl:
    Description: Callback URL to paste into Meta App Dashboard -> Webhooks -> WhatsApp -> Configure
    Value: !Sub 'https://${BackendApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/webhook/whatsapp'
  ConfigUrl:
    Description: Feature-toggle config endpoint for the site (GET /config)
    Value: !Sub 'https://${BackendApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/config'
  AuthUrl:
    Description: Google OAuth login entry point (GET /auth/login)
    Value: !Sub 'https://${BackendApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/auth/login'
  ToggleUrl:
    Description: Admin toggle endpoint (POST /toggle)
    Value: !Sub 'https://${BackendApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/toggle'
